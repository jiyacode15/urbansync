<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore Issues | UrbanSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}" />
</head>
<body>
  <header class="topbar">
    <nav class="navbar glass">
      <a href="/" class="brand"><span class="brand-mark">U</span>URBANSYNC</a>
      <button class="nav-toggle" aria-label="Toggle navigation"><i class="fa-solid fa-bars"></i></button>
      <div class="nav-menu">
        <a href="/">Home</a>
        <a href="/issues">Explore Issues</a>
        <a href="/report">Report Issue</a>
        <a href="/services">Services</a>
        <a href="/community">Community</a>
        <a href="/admin">Dashboard</a>
      </div>
      <div class="nav-actions">
        <a class="link-btn" href="/admin/login">Login</a>
        <a class="primary-btn" href="/report">Get Started</a>
      </div>
    </nav>
  </header>

  <main class="page-wrap section-space">
    <div class="section-heading">
      <span class="section-tag">EXPLORE ISSUES</span>
      <h2>City reports and service activity</h2>
    </div>

    <div class="issue-toolbar glass">
      <div class="view-switch">
        <button class="filter-pill active" data-view="list">LIST VIEW</button>
        <button class="filter-pill" data-view="map">MAP VIEW</button>
      </div>
      <div class="issue-filters">
        <input id="issue-search" type="text" placeholder="Search city reports..." />
        <select id="filter-category"><option value="">Category</option></select>
        <select id="filter-status"><option value="">Status</option></select>
        <select id="filter-priority"><option value="">Priority</option></select>
        <select id="filter-area"><option value="">Area</option></select>
      </div>
    </div>

    <div id="issue-list-view" class="issue-list-view"></div>
    <div id="issue-map-view" class="map-panel hidden">
      <div id="city-map" style="height: 560px; border-radius: 20px; overflow: hidden; width: 100%;"></div>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="{{ url_for('static', path='js/map.js') }}"></script>
</body>
</html>
